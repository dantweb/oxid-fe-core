name: CI

on:
  push:
    # feature branches get the same gate as main — no PR needed to see a branch green
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm run knip
      - run: npm run test:coverage
      - run: npm run build
      - run: npm run evaluate
